services:
  backend:
    image: lolaedoc/bouton-rouge:backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    image: lolaedoc/bouton-rouge:frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
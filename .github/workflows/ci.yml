name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('CI manuelle sur {0}', github.ref_name)
    || format('CI sur {0}', github.ref_name) }}

on:
  push:
    branches-ignore:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. ANALYSE DE SÉCURITÉ GITLEAKS
  # ==========================================

  gitleaks:
    name: Recherche de secrets
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyser les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Création d'un rapport JSON et SARIF de gitleaks
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  # ==========================================
  # 2. TESTS BACKEND
  # ==========================================

  test:
    name: Tests et audit JavaScript BACKEND
    needs: gitleaks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Auditer les dépendances
        run: npm audit --audit-level=moderate

      - name: Exécuter les tests Jest
        run: npm test -- --runInBand

  # ==========================================
  # 3. FUSION AUTOMATIQUE VERS DEV
  # ==========================================

  merge-dev:
    name: Fusion automatique vers dev

    if: >-
      github.event_name == 'push'
      && github.ref != 'refs/heads/dev'

    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    concurrency:
      group: merge-dev
      cancel-in-progress: false

    steps:
      - name: Récupérer la branche dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fusionner la branche source dans dev
        id: merge
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$SOURCE_BRANCH" dev

          git checkout dev
          git reset --hard origin/dev

          if git merge-base --is-ancestor "origin/$SOURCE_BRANCH" HEAD; then
            echo "Aucun nouveau commit à fusionner."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff \
            "origin/$SOURCE_BRANCH" \
            -m "Merge branch '$SOURCE_BRANCH' into dev"

          git push origin HEAD:dev

          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Relancer la CI sur dev
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref dev

    # ==========================================
    # 4. BUILD ET PUBLICATION DOCKER HUB
    # ==========================================

  build:
    name: Build et publication Docker Hub

    if: >-
      github.ref == 'refs/heads/dev'
      && (github.event_name == 'push'
      || github.event_name == 'workflow_dispatch')

    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construction du backend
      - name: Construire l'image backend
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "lolaedoc/bouton-rouge:backend-${{ github.sha }}" \
            -t "lolaedoc/bouton-rouge:backend" \
            ./backend

      # Construction du frontend
      - name: Construire l'image frontend
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "lolaedoc/bouton-rouge:frontend-${{ github.sha }}" \
            -t "lolaedoc/bouton-rouge:frontend" \
            ./frontend

      # Utilisation de Trivy pour vérification de l'image backend avant le push
      - name: Scanner l'image backend avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "lolaedoc/bouton-rouge:backend"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      # Publication du backend
      - name: Publier le backend
        run: |
          docker push "lolaedoc/bouton-rouge:backend-${{ github.sha }}"
          docker push "lolaedoc/bouton-rouge:backend"

      # Publication du frontend
      - name: Publier le frontend
        run: |
          docker push "lolaedoc/bouton-rouge:frontend-${{ github.sha }}"
          docker push "lolaedoc/bouton-rouge:frontend"